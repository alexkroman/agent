# Supabase CLI project config.
#
# Two jobs, and for a long time this file only admitted to the first:
#
# 1. Applying `migrations/` to the platform database
#    (`supabase link --project-ref <ref>` then `supabase db push`).
# 2. **Declaring the shape of the LOCAL stack**, which is the platform tier's one
#    real arm. `scripts/with-test-pg.mjs` lists `supabase start` first among the
#    databases it hopes to find and shells out to `supabase status -o env` to
#    resolve it; `packages/aai-server/realtime-rls.scenario.test.ts` and the two
#    `store-conformance.scenario.test.ts` files are written against it; and
#    nothing anywhere runs `aai_platform` WITHOUT Vault, pg_cron and walrus, so a
#    stock Postgres is not an alternative to it.
#
# The header used to say the opposite outright — "The platform does not run a
# local Supabase stack: dev and tests use in-memory stores… the only thing the
# CLI is used for here is migrations" — and `major_version` was annotated "Only
# used by a local `supabase start`, which this repo does not require." Both were
# true when written and neither is now.
#
# Sections for auth/storage/realtime *dashboard* settings are still intentionally
# absent: those are configured in the Supabase dashboard, and duplicating them
# here would create a second source of truth that nothing applies. What belongs
# here is the local stack's own shape, which this file is the only place to state.

project_id = "aai-platform"

[db]
# Matches the Postgres major the platform's Supabase project runs — and the
# image a local `supabase start` therefore brings up
# (`public.ecr.aws/supabase/postgres`), which is why the extension arms are real:
# supabase_vault, pgmq, pg_cron and pg_net are all in it.
major_version = 17

# The TRANSACTION-mode pooler, ON, because local dev now runs the same path
# production does: the platform's ADMIN pool connects through Supavisor
# (`PLATFORM_POOLER_URL`, which `scripts/dev-server.mjs` derives from this stanza
# and the stack's own DB_URL). A production-only connection path is exactly the
# arm this repo keeps finding broken — nothing local runs it, so nothing notices.
#
# It costs one more container on every `supabase start`, which was the whole
# argument for leaving it off. Setting `enabled = false` gives that back: the
# admin pool then opens DIRECT connections and boot warns, naming the trade.
#
# ── WHAT IT IS FOR, AND WHAT A RUN THROUGH IT MEASURED (2026-08-17) ──────────
#
# `assertSessionModeUrl` refuses a transaction-mode `SUPABASE_DB_URL` at boot
# because an advisory lock taken through one is not held by whoever thinks it
# holds it — the pooler returns the server connection between statements, so
# `platform-lock.ts`'s whole mutual-exclusion premise evaporates silently. That
# was described here as one of the three bugs this repo has shipped and the only
# one NEVER REPRODUCED, for want of a transaction-mode port to take a lock
# through. There is one now, and it is reproduced:
#
# - The tenant is `postgres.pooler-dev`. A bare `postgres` is refused
#   `(ENOIDENTIFIER) no tenant identifier provided` — Supavisor reads the tenant
#   from a username SUFFIX, because its hostname is shared across projects.
# - `pg_advisory_lock` (SESSION-scoped): a RIVAL connection acquired the same lock
#   while it was held. Silent loss of mutual exclusion, confirmed. This is why the
#   SLUG-LOCK pool keeps the direct URL.
# - `pg_try_advisory_xact_lock` inside `begin … commit`: correct throughout — one
#   pinned backend for the transaction, a rival's try-lock refused while held, and
#   released by the commit. That is what makes the wake sweep's leader election
#   safe through this pooler, and so what lets the admin pool use it.
[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

# The deploy-artifact bucket, so `SUPABASE_STORAGE_BUCKET` resolves against the
# local stack and `blob-storage.ts` has an arm at all.
#
# It is the one piece of this platform's Supabase state that lives in the
# dashboard rather than in `migrations/`, which is why `assertBucketPrivate`
# exists — and why blob storage is registered in `store-conformance.ts` with
# `conformance: false`: there was nothing local to point a real arm at. Private,
# because production's is: blobs are read through an authenticated `download()`
# or a per-call signed URL, never publicly.
[storage]
enabled = true

[storage.buckets.blobs]
public = false

# GoTrue, which is the local arm of the studio's BROWSER auth.
#
# It is declared here because a platform database now REFUSES no-auth dev tokens
# (`createStudioAuthFromEnv`): if platform state is in Supabase, identity is too.
# So the local stack has to be able to sign somebody in, and this is where that
# is stated — the dashboard settings this file otherwise stays out of are
# production's, and this section describes the local stack's own shape.
#
# `site_url` and `additional_redirect_urls` are the allow-list GoTrue validates
# `redirect_to` against, and `signInWithOAuth` sends `window.location.href` — so
# the studio's own origin has to be in it or the round trip comes back rejected
# with nothing on the page saying why. Port 8080 is `DEFAULT_PORT`
# (`aai-server/constants.ts`); both spellings of loopback are listed because a
# browser will use whichever the developer typed.
[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://127.0.0.1:8080"]

# The studio signs in with GitHub and nothing else (`auth.tsx`), so a local stack
# with no GitHub provider has no sign-in at all. Point a GitHub OAuth app at the
# local callback below and export the pair; `supabase start` interpolates `env()`
# at stack start, so a missing value leaves the provider disabled rather than
# failing the stack.
#
#   https://github.com/settings/developers → New OAuth App
#   Homepage URL:               http://localhost:8080
#   Authorization callback URL: http://127.0.0.1:54321/auth/v1/callback
#
# The callback is GOTRUE's, not the studio's: GitHub redirects to Supabase, which
# then redirects to `redirect_to` above. Pointing it at :8080 is the mistake this
# comment exists to pre-empt — it fails with GitHub's own opaque error page.
[auth.external.github]
enabled = true
client_id = "env(AAI_LOCAL_GITHUB_CLIENT_ID)"
secret = "env(AAI_LOCAL_GITHUB_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
