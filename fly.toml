app = 'aai-agent'
primary_region = 'sjc'

# ── Shutdown ──
# These MUST stay above the first [table]. In TOML, bare keys after a table
# header belong to that table — they sat at the bottom of this file, below
# [metrics], so Fly parsed them as `metrics.kill_signal`/`metrics.kill_timeout`
# and silently ignored both. Verified with `fly config show --local`: down there
# they read as null, up here they read as SIGTERM / 2m30s. The Machines API
# agreed (kill_timeout: null) and the deploy logs showed Fly sending its default
# SIGINT, which means the process was really being force-killed 5s after the
# stop signal.
kill_signal = "SIGTERM"
# Seconds (integer; a "150s" string also parses). 150 leaves the 120s session
# drain (SHUTDOWN_DRAIN_MS) room to finish, plus slack for sandbox teardown and
# the listener close after it. Fly caps this at 300. Raising the drain means
# raising this first, or Fly SIGKILLs mid-drain and the wait buys nothing.
kill_timeout = 150

[build]
  dockerfile = "packages/aai-server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  MAX_CONNECTIONS = "100"
  MAX_VMS = "10"
  # Pre-warm Deno/gVisor harnesses so first-session cold starts skip the
  # spawn → JIT → gVisor bootstrap path. Avoids CPU-starving healthchecks
  # on the 1-CPU VM.
  SANDBOX_POOL_SIZE = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    # A /health hit is trivial, but this VM has one CPU and spends boot
    # spawning Deno harnesses — 2s was tight enough to fail a machine that was
    # merely busy, which ejects it from rotation.
    timeout = "5s"
    # Sized to clear a real cold boot with headroom: the listener does not bind
    # until `prepareRootfs` finishes (~32s), and the check passes ~42s after
    # init. 15s did not cover that; 60s does.
    #
    # Be clear about what this buys, because it was measured rather than
    # assumed: going 5s → 15s changed nothing about the "Health check has
    # failed" line. Machine d894075b3d7038 booted v347 with grace_period 15s
    # (confirmed against the Machines API) and still reported the failure 1s
    # after init — same second as under 5s. Whatever emits that line reports the
    # check's not-yet-passing state at machine start; it is not an attempt this
    # window suppresses. So this keeps a slow boot from counting against the
    # machine, and that is all. Silencing the line would mean binding the port
    # before the sandbox rootfs is ready, which would advertise a machine that
    # cannot start a session for another ~24s — the line is reporting something
    # true, so it is left alone deliberately.
    grace_period = "60s"
    method = "GET"
    path = "/health"

[deploy]
  # Bluegreen boots a replacement alongside each running machine and only moves
  # traffic once every new machine passes health checks. Rolling replaced them
  # in place, which with 2 machines meant serving on half capacity for the ~42s
  # each took to boot — and Fly says as much during it ("services exposed on
  # ports [80, 443] will have intermittent failures"). Here the old machines
  # keep serving until the new ones are actually ready.
  #
  # Costs two extra machines for the length of a deploy (4 total, briefly);
  # steady state is unchanged at 2. Eligible because the app has no volumes,
  # which bluegreen cannot migrate.
  #
  # Note this does not by itself save calls in flight: at cutover the old
  # machines still stop. That is what the drain below is for.
  strategy = "bluegreen"

[metrics]
  port = 8080
  path = "/metrics"

[[vm]]
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
  # NOTE: machine count is not a fly.toml [[vm]] setting — it comes from
  # `fly scale count` (currently 2). A `scale = 5` key lived here and did
  # nothing: Fly ignores unknown keys silently, so it read as "we run 5
  # machines" while the app ran 2. Change the count with the CLI, not here.
