app = 'aai-agent'
primary_region = 'sjc'

[build]
  dockerfile = "packages/aai-server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  MAX_CONNECTIONS = "100"
  MAX_VMS = "10"
  # Pre-warm Deno/gVisor harnesses so first-session cold starts skip the
  # spawn → JIT → gVisor bootstrap path. Avoids CPU-starving healthchecks
  # on the 1-CPU VM.
  SANDBOX_POOL_SIZE = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    # A /health hit is trivial, but this VM has one CPU and spends boot
    # spawning Deno harnesses — 2s was tight enough to fail a machine that was
    # merely busy, which ejects it from rotation.
    timeout = "5s"
    # Sized to clear a real cold boot with headroom: the listener does not bind
    # until `prepareRootfs` finishes (~32s), and the check passes ~42s after
    # init. 15s did not cover that; 60s does.
    #
    # Be clear about what this buys, because it was measured rather than
    # assumed: going 5s → 15s changed nothing about the "Health check has
    # failed" line. Machine d894075b3d7038 booted v347 with grace_period 15s
    # (confirmed against the Machines API) and still reported the failure 1s
    # after init — same second as under 5s. Whatever emits that line reports the
    # check's not-yet-passing state at machine start; it is not an attempt this
    # window suppresses. So this keeps a slow boot from counting against the
    # machine, and that is all. Silencing the line would mean binding the port
    # before the sandbox rootfs is ready, which would advertise a machine that
    # cannot start a session for another ~24s — the line is reporting something
    # true, so it is left alone deliberately.
    grace_period = "60s"
    method = "GET"
    path = "/health"

[deploy]
  strategy = "rolling"

[metrics]
  port = 8080
  path = "/metrics"

kill_signal = "SIGTERM"
kill_timeout = "10s"

[[vm]]
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
  # NOTE: machine count is not a fly.toml [[vm]] setting — it comes from
  # `fly scale count` (currently 2). A `scale = 5` key lived here and did
  # nothing: Fly ignores unknown keys silently, so it read as "we run 5
  # machines" while the app ran 2. Change the count with the CLI, not here.
