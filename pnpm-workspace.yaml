minimumReleaseAge: 1440

# The ONE exemption from the quarantine above, and it is meant to be temporary.
#
# biome 2.5.9 through 2.5.11 regress the nursery `noFloatingPromises` rule on
# `p-timeout`: nine `await pTimeout(…)` call sites across four packages are
# reported as floating promises, and the offered fix is `await await`. Every one
# is already awaited, so the only way to take those versions is nine
# `biome-ignore` comments — which is what `check:hatches` exists to refuse.
# 2.5.12 fixes it (verified by running its binary against
# `postgres-pool-exhaustion.scenario.test.ts`, which 2.5.11 reports and 2.5.12
# does not) and was hours old when this landed, so the alternative was an exact
# pin holding the linter a release behind indefinitely — a caret cannot hold one,
# since pnpm keeps a locked 2.5.11 against `^2.5.8`.
#
# The pattern has to be the SCOPE, not `@biomejs/biome`: the CLI is a thin
# wrapper whose platform binary (`@biomejs/cli-linux-x64` and its siblings) is
# an optionalDependency published in the same batch, so exempting only the
# wrapper still fails resolution — on the binary, one layer down, which is why
# the error names a package nothing in this repo declares.
#
# Scoped to the one publisher rather than lowering the window, so every other
# third-party dependency keeps the full 24 hours. It is also the safest thing in
# the tree to exempt: biome is a devDependency that runs over source and never
# ships, and nothing imports it. DELETE this entry once the pinned version is
# comfortably past the window — it buys nothing after that, and an exemption
# nobody revisits is how a supply-chain control quietly stops applying to the
# dependency most likely to need it next.
minimumReleaseAgeExclude:
  - "@biomejs/*"

# Disable pnpm's verify-deps-before-run check. When `pnpm exec`/`pnpm run` is
# invoked (e.g. `pnpm exec turbo run lint typecheck`) against a restored CI
# cache whose workspace-state file is missing/empty, the check crashes with
# "Unexpected end of JSON input" in loadWorkspaceState. CI verifies deps
# explicitly via `pnpm install --frozen-lockfile` instead.
#
# This lives HERE and not in `.npmrc`, which is where it used to live and where
# it silently stopped working: pnpm 11 reads no pnpm-specific setting from
# `.npmrc`. Measured on 11.24.0 — `.npmrc` resolves the key to `undefined`,
# this file resolves it to `false`, and 10.29.3 reads it from here too, so one
# spelling covers both majors. The symptom under 11 was `pnpm dev:aai-server`
# spawning a synchronous `pnpm install` first, and a Ctrl-C during it printing
# a pnpm stack trace that names `pnpm install` rather than the dev server.
# The check runs in the OUTER pnpm before `packageManager` re-execs the pinned
# version, so pinning 10.29.3 does not protect against it.
verifyDepsBeforeRun: false

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - protobufjs

overrides:
  unrun: 0.2.39

patchedDependencies:
  cbor-x@1.6.5: patches/cbor-x@1.6.5.patch
