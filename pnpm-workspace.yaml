  - docs

catalog:
  "@ai-sdk/mcp": ^2.0.57
  "@hono/otel": ^1.1.2
  "@hono/zod-validator": ^0.9.1
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/context-async-hooks": ^2.11.0
  "@opentelemetry/exporter-metrics-otlp-proto": ^0.222.0
  "@opentelemetry/exporter-trace-otlp-proto": ^0.222.0
  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/sdk-metrics": ^2.11.0
  "@opentelemetry/sdk-trace-base": ^2.11.0
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/json-schema": ^7.0.15
  "@types/mime-types": ^3.0.1
  "@types/node": ^24.13.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/ws": ^8.18.1
  "@vitejs/plugin-react": ^6.1.1
  ai: ^7.0.113
  clsx: ^2.1.1
  eventsource-parser: ^4.1.1
  fast-check: ^4.10.2
  hono: ^4.13.9
  # Held on 30.0.x: jsdom 30.1 moved a Blob's impl off its own symbols, and
  # vitest <5.0.3's jsdom `URL.createObjectURL` shim reads it there, so every
  # worklet's `createObjectURL(new Blob(...))` throws. Widen to ^30.1 with
  # vitest ^5.0.3 (which reads it via `getBlobImpl`).
  jsdom: ~30.0.1
  mime-types: ^3.0.2
  nanoevents: ^10.0.0
  p-timeout: ^7.0.2
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  tokenx: ^2.1.0
  tsdown: ^0.22.14
  typescript: ^7.0.2
  ulid: ^3.0.2
  use-stick-to-bottom: ^1.1.6
  vite: ^8.3.1
  vitest: ^5.0.1
  ws: ^8.21.3
  xstate: ^5.33.2
  zod: ^4.6.5

catalogs:
  typedoc:
    typescript: ~6.0.3
    # The same 6.x compiler under a second name, for the ROOT's scripts: the
    # root already declares `typescript` (the 7.x the repo builds with), so
    # the capability-contract probe (`scripts/_api-contracts-compat.mjs`)
    # cannot reach the JS compiler API under that name. See its header.
    typescript-6: npm:typescript@~6.0.3

ignoredBuiltDependencies:
  - esbuild
  - lefthook

minimumReleaseAge: 1440

# Disable pnpm's verify-deps-before-run check. When `pnpm exec`/`pnpm run` is
# invoked (e.g. `pnpm exec turbo run lint typecheck`) against a restored CI
# cache whose workspace-state file is missing/empty, the check crashes with
# "Unexpected end of JSON input" in loadWorkspaceState. CI verifies deps
# explicitly via `pnpm install --frozen-lockfile` instead.
#
# This lives HERE and not in `.npmrc`, which is where it used to live and where
# it silently stopped working: pnpm 11 reads no pnpm-specific setting from
# `.npmrc`. Measured on 11.24.0 — `.npmrc` resolves the key to `undefined`,
# this file resolves it to `false`, and 10.29.3 reads it from here too, so one
# spelling covers both majors. The symptom under 11 was `pnpm dev:aai-server`
# spawning a synchronous `pnpm install` first, and a Ctrl-C during it printing
# a pnpm stack trace that names `pnpm install` rather than the dev server.
# The check runs in the OUTER pnpm before `packageManager` re-execs the pinned
# version, so pinning 10.29.3 does not protect against it.
verifyDepsBeforeRun: false

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - protobufjs

overrides:
  # vitest's OPTIONAL jsdom peer otherwise resolves to the newest jsdom in
  # every package that does not declare one (the root included), bypassing the
  # catalog's 30.0.x hold. Delete with that hold.
  jsdom: "catalog:"
  unrun: 0.2.39

patchedDependencies:
  cbor-x@1.6.6: patches/cbor-x@1.6.6.patch
