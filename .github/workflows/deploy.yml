# Deploys the platform to Modal — but ONLY when the code it ships actually
# changed in the push. Versions only move via changesets (the merged "Version
# Packages" PR), so a docs-only merge ships nothing. workflow_dispatch is the
# manual escape hatch to ship outside a changeset release.
#
# There is ONE Modal app (`aai-server-web`, from packages/aai-server/
# modal_deploy.py) and it serves both surfaces from the aai-studio-server entry
# — see "One app, both surfaces" in that file. So a bump to EITHER package is a
# reason to deploy: aai-server is the platform core the app is built from, and
# aai-studio-server is the entry it actually runs. Gating on aai-server alone
# would silently strand every studio-only release.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the platform to Modal
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        name: Detect changeset version bumps
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=${{ inputs.deploy }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bumped() {
            # True when the package's version field changed in this push —
            # the changesets release commit is the only thing that moves it.
            git diff HEAD^ HEAD -- "packages/$1/package.json" | grep -q '^+.*"version":'
          }
          if bumped aai-server || bumped aai-studio-server; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changed
    if: needs.changed.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install modal
      - name: Deploy platform
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy packages/aai-server/modal_deploy.py
