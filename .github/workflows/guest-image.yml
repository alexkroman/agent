# Publishes the guest sandbox image to GHCR — the image every sandbox backend
# pulls (packages/aai-server/guest-image.Dockerfile).
#
# It runs on EVERY push to main, with no `paths` filter, and that is deliberate:
# the image tag hashes the harness BUNDLE, and the harness bundles the SDK, the
# host runtime, the UI and the CLI — so almost any change to packages/ produces a
# new tag. A filter that tried to name them would silently stop publishing the
# moment it went stale, and the symptom is a tag the server asks for and no
# registry has.
#
# A run that changes nothing is cheap rather than skipped: the tag is
# content-addressed, so an unchanged tree resolves to a tag that already exists
# and every layer is a cache hit.
#
# NOT a dependency of Deploy yet, because `GUEST_IMAGE_REGISTRY` is unset in
# production and the server still builds its own Modal snapshot image (see
# guest-image-source.ts). When that default flips, Deploy must `needs:` this —
# otherwise a deploy can ship a server asking for an image this never pushed.
#
# ONE-TIME MANUAL STEP: a GHCR package is PRIVATE on first push. After the first
# successful run, set the `aai-guest-harness` package to public in the repo's
# Packages settings — otherwise Modal cannot pull it without a registry Secret,
# which `guest-image-source.ts` deliberately does not thread through.
name: Guest image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress: a superseded commit's image may still be the one a
  # deploy in flight is about to ask for.
  group: guest-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The arm64 leg builds under QEMU emulation (the runner is amd64), and its
    # slow part is two npm installs of ~750 packages. Bounded so a pathological
    # run cannot burn an hour; if this becomes the norm, split the build across a
    # native amd64 + native arm64 matrix and merge the manifests.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The image installs the SDK packages from npm at the EXACT versions this
      # checkout declares (`resolveSdkSpecs`) — they cannot be lockfile-pinned,
      # because an integrity hash only exists once a version is published. This
      # workflow and Release both trigger on a push to main, in PARALLEL, so a
      # release that has not published yet makes the image build 404. Same
      # failure and same remedy as the Deploy job's wait; see that script's doc.
      - name: Wait for the SDK versions to be readable from npm
        timeout-minutes: 30
        run: node scripts/wait-for-npm-versions.mjs

      # Builds the harness bundle the image COPYs, plus everything it bundles.
      - run: pnpm exec turbo run build --filter aai-guest...

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry is the OWNER, not the repo: the tag already carries the
      # image name (`aai-guest-harness:<sha16>`), and `guestImageRef` joins the
      # two with one slash — the same join the server does when it resolves a
      # pinned tag.
      - name: Build and push
        id: push
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Printed first so a failed build still tells you which tag it wanted.
          ref="$(node scripts/build-guest-image.mjs --print-tag --registry "$REGISTRY")"
          echo "Publishing $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          node scripts/build-guest-image.mjs \
            --registry "$REGISTRY" \
            --platform linux/amd64,linux/arm64 \
            --cache-gha \
            --push

      - name: Summary
        run: |
          {
            echo "### Guest image published"
            echo
            echo '```'
            echo "${{ steps.push.outputs.ref }}"
            echo '```'
            echo
            echo "Pull it in a dev server with:"
            echo
            echo '```sh'
            echo "GUEST_IMAGE_REGISTRY=ghcr.io/${{ github.repository_owner }} pnpm dev:aai-server"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
