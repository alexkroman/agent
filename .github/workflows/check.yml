name: Check

# `main` IS in the push list, and leaving it out was this workflow's largest
# blind spot: every run of this file was a `pull_request` (or a manual
# dispatch) evaluating a MERGE REF, so nothing anywhere ever evaluated main
# itself. "PRs are green" was therefore a statement about candidate merges and
# said nothing about the branch — and the workflows that DO run on a push to
# main (`ship.yml`, `docs.yml`) are run by no pull request, so
# a break in one of them was reported to nobody. #1112 is the worked example:
# the release line had failed on every push to main since #1057 and its description
# names the cause — "the only surface that reports it is a red workflow on
# `main` that no PR author is looking at".
#
# A PR result also goes STALE. It is computed against the base as it stood when
# the run started, and nothing recomputes it: #1112 and #1113 shared a base of
# 0f7c4da, ran their checks 67 minutes apart, and merged 12 seconds apart, so
# neither was ever tested with the other's changes. That gap is closed by
# branch protection ("require branches to be up to date", or a merge queue),
# which a workflow file cannot express — but running here on main is what makes
# the resulting breakage VISIBLE rather than silent.
#
# The push list is `main` and nothing else. `changeset-release/main` used to sit
# beside it, and it was a straight DUPLICATE: that branch's PR targets main, so
# the `pull_request` arm below already covers it, the two runs land in different
# concurrency groups, and nothing dedupes them — every push to a Version
# Packages PR ran this whole matrix twice. 97 such runs exist in the history.
# They stopped on 2026-08-07, when RELEASE_TOKEN went dead: `GITHUB_TOKEN`
# cannot trigger a workflow. That PAT has since been removed outright, so the
# entry can never fire again — but for weeks it was config that fires nothing,
# invisible in a diff and in the run list alike.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # **Per-SHA on a push, per-PR on a pull request**, and the push half is what
  # makes `cancel-in-progress: false` below mean anything. GitHub keeps at most
  # ONE pending run per group and cancels it when a newer run joins, so
  # declining to cancel the in-flight run does not save the queued one: with
  # every commit on main sharing a single `github.ref` group, each main run died
  # at the exact second the next merge arrived. Measured over 28 consecutive
  # main pushes: 5 cancelled, each one's `updated_at` equal to the next run's
  # `created_at`, and NOTHING reached a verdict on main between 16:00 and 21:57
  # on 2026-08-18 — precisely the "gap in its history exactly where it is
  # merging fastest" the note below says the setting exists to prevent.
  #
  # It has to stay `pull_request.number` on the PR side rather than a bare
  # `github.sha`: a PR's sha is the MERGE ref and changes on every push, so a
  # per-SHA group there would put each push in its own group and cancel nothing.
  group: check-${{ github.event.pull_request.number || github.sha }}
  # Cancel supersedes only on PULL REQUESTS, where the newest push is the only
  # candidate anyone cares about. On a push it must not: each commit on main is
  # a distinct thing to have a verdict about, and cancelling the in-flight run
  # when the next merge lands is how a branch acquires a gap in its history
  # exactly where it is merging fastest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NO .tsbuildinfo cache here. This job runs `turbo run build`, and the
      # build configs set `incremental: false` — only `typecheck` writes
      # `.tsbuildinfo/`, so the step that used to sit here restored into a job
      # that never wrote the directory, and the job that does write it
      # (lint-typecheck-and-checks) never saved. tsc therefore ran cold on
      # every turbo cache miss. The cache now lives beside its producer.
      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm exec turbo run build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}

  lint-typecheck-and-checks:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - id: workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      # Beside the only task that writes it (`typecheck`; the build configs set
      # `incremental: false`). Keyed on the tsconfigs and the lockfile — what
      # invalidates a tsc program — with the run's SHA appended so each run
      # saves a fresh entry; a key that already exists is skipped on save, so a
      # SHA-less key would freeze the first run's buildinfo forever.
      - name: Cache TypeScript incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tsbuildinfo/
          key: tsbuildinfo-typecheck-${{ runner.os }}-${{ hashFiles('packages/*/tsconfig.json', 'tsconfig.json', 'tsconfig.tools.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-typecheck-${{ runner.os }}-${{ hashFiles('packages/*/tsconfig.json', 'tsconfig.json', 'tsconfig.tools.json', 'pnpm-lock.yaml') }}-
            tsbuildinfo-typecheck-${{ runner.os }}-
      - run: pnpm exec turbo run lint typecheck typecheck:tools typecheck:scripts
      - name: Check for changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !contains(github.event.pull_request.labels.*.name, 'no-release')
        run: pnpm changeset status --since=origin/main
      # The tasks that are NOT rows of the gate table: the turbo tasks, plus
      # the seven root-level scripts turbo cannot own.
      - run: |
          pnpm exec turbo run check:publint check:attw docs
          pnpm run check:knip
          # `turbo run lint` above is per-PACKAGE, and scripts/ is not a
          # package — so until this line it was the one source directory in
          # the repo that no lint job touched.
          pnpm run lint:root
          pnpm run check:syncpack
          # Manifest SHAPE, the other half of syncpack. See `//#check:format`
          # in turbo.json for why `sortExports` has to name `@dev/source`.
          pnpm run check:format
          # Duplicate versions resolved side by side in the lockfile. Here
          # rather than in `check:local` because it resolves against the
          # registry, which is a flake a pre-commit gate should not own.
          pnpm run check:dedupe
          pnpm run check:sherif
          pnpm run check:markdown
      # EVERY quality gate, DERIVED — the ratchets and the after-build gates,
      # in the table's own order, read out of scripts/check.mjs rather than
      # restated here.
      #
      # This block used to be ~20 hand-copied `pnpm run check:*` lines, and the
      # copy drifted the only way it could: a PR deleted a gate's script, its
      # row and its spec, and left the line here. `pnpm run <missing>` exits
      # non-zero under `bash -e`, and this job is in the required `ci` job's
      # `needs` — so every push on that branch, and every push to main after
      # it merged, would have failed CI while `pnpm check` stayed green
      # locally. There is one list now, in one file, and a gate added or
      # removed there needs no edit to this one.
      #
      # `--gates ci` names the PHASES this job owns (`GATE_SELECTIONS` there):
      # the pure git/fs ratchets, and the after-build gates that read the
      # `dist` restored above. The third phase, `after-tests`, belongs to the
      # coverage matrix below. The runner keeps each row's `fatal` field rather
      # than flattening it into `bash -e`: a fatal gate stops the run, and the
      # ratchets are all reported together, so a branch tripping three learns
      # about three. A failing gate also emits a `::error` annotation naming
      # itself, and `check:konsistent` still emits its own inline ones because
      # GITHUB_ACTIONS reaches it unchanged.
      #
      # `packages/aai-templates/gate-wiring.test.ts` is the guard: it parses
      # the table and this file independently and fails if either goes empty,
      # if a gate is enforced by neither this step nor a named command, or if
      # any `pnpm run …` here names a script the root manifest does not
      # declare — which is the exact break above.
      - name: Quality gates (derived from scripts/check.mjs)
        run: node scripts/check.mjs --gates ci

  # Unit tests sharded by package — run in parallel
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every workspace package with a `test:coverage` script. `aai-evals`
        # was absent, so its seven unit suites and its four coverage floors
        # were gated by nothing in CI while passing locally (`scripts/check.mjs`
        # runs `turbo run test:coverage` unfiltered) — the "green locally, red
        # in CI" asymmetry running backwards, and fully green for a PR that
        # breaks them. This is NOT the documented eval-tier exemption: that is
        # scoped to `check:eval`, which is separately and deliberately absent.
        package: [aai, aai-ui, aai-runtime, aai-cli, aai-guest, aai-server, aai-studio-server, aai-studio-client, aai-templates, aai-evals]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - id: workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      # Through turbo rather than pnpm directly, for the `^build` ordering.
      # Running the package script straight assumes the workspace cache restore
      # above put every dependency's `dist` back; when it does not (an evicted
      # or partial entry) the suite fails on a missing built artifact —
      # aai-server alone resolves two, `aai-ui/dist/default-client` and
      # `aai-guest/harness` — with an error that names a file nothing in the
      # package touches. Under turbo those builds are cache hits from the setup
      # job in the normal case and a real rebuild in the abnormal one.
      - run: pnpm exec turbo run test:coverage --filter "./packages/${{ matrix.package }}"
      # The PER-FILE floor, in the job that has the data. The thresholds in each
      # vitest.config.ts are package-wide and cannot see one new module landing
      # untested — a ~300-line aai-ui module once came in at 1.44% line coverage
      # and was caught only because it happened to drag the whole package under
      # its floor. `--package` exists for this step: a matrix job holds only its
      # own coverage output, and running the gate solely from scripts/check.mjs
      # would leave it enforced by the pre-push hook alone, which
      # `git push --no-verify` skips.
      #
      # The quoting here is the reason `requiredValue` exists in
      # `scripts/_args.mjs`. A matrix variable that does not expand sends
      # `--package ""` — a legal parse answering the empty string, which the old
      # `argv.indexOf` + `argv[i + 1]` reader and `parseArgs` alike accept. That
      # selected zero packages, measured nothing, and printed the gate's success
      # line: the per-file coverage floor for every package in this matrix,
      # green over a measurement of nothing. It is now exit 2 with the reason
      # named, so a broken matrix reddens the job instead.
      - run: node scripts/check-coverage-per-file.mjs --package "${{ matrix.package }}"

  # Both middle tiers. Named for both because it runs both: the integration tier
  # (in-memory, no real resource) and the scenario tier (a real subprocess, port,
  # bundler, or the Postgres started below).
  integration-and-scenario:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: tsdown/rolldown can't resolve .ts exports in aai dist
        os: [ubuntu-latest, macos-latest]
        node: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - id: workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      # Postgres for the platform SCENARIO tests: the per-slug advisory lock
      # and the migration + its stores. Both assert PostgreSQL semantics that
      # their unit suites can only assert in prose (see
      # platform-lock.scenario.test.ts).
      #
      # **The PRODUCTION image, not the runner's stock cluster.** `systemctl
      # start postgresql` gave a server with no Supabase extension, which is a
      # deployment nobody has: `platform-schema.scenario.test.ts` had to strip
      # every `create extension` line with a regex and hand-write a plpgsql
      # `pgmq.create` stub to make the migration runnable at all, and Vault,
      # pg_cron and pg_net had no arm anywhere. This is the same image the
      # production project runs, and all four extensions install in a plain
      # container of it (verified locally; the amd64 pull is 0.37 GB compressed
      # across 29 layers, against a tier that runs in ~3s).
      #
      # Still a STEP rather than a `services:` container, and the reason the old
      # comment gave has NOT stopped applying: `services:` is per-JOB, this job's
      # matrix includes macos-latest, and Docker is unavailable there — so a
      # `services:` block would fail that leg, which still runs every scenario
      # suite that needs a subprocess or a port rather than a database. The
      # database behaviour under test is OS-independent, so the ubuntu leg covers
      # it and the tests announce their own skip on macOS.
      - name: Start Postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          PG_IMAGE=public.ecr.aws/supabase/postgres:17.6.1.155
          # The runner's own cluster occupies 5432; this image replaces it.
          sudo systemctl stop postgresql || true
          # **The pull is its own RETRIED command, because `docker run`'s
          # implicit pull has no retry and this registry throttles.**
          # public.ecr.aws rate-limits unauthenticated pulls per source IP, and
          # hosted runners share theirs — so the quota is spent by strangers and
          # nothing about this repo's own traffic predicts a hit.
          #
          # Measured 2026-08-18: three runs across two PRs died on
          # `docker: toomanyrequests: Rate exceeded` at exit 125, BEFORE a single
          # test executed, and every one passed on a plain rerun. That is a false
          # RED on the only required check — the failure this file's header is
          # most emphatic about — arriving through the cheapest possible cause,
          # a request that only ever needed making twice.
          #
          # Retried on TRANSIENT text ONLY, never blanket. A wrong tag has to
          # stay fast and loud, which is the same argument the extension check
          # below is built on; retrying everything would turn a typo into a
          # minute of waiting in front of an error nobody reads.
          #
          # 5s, 15s, 45s rather than a fixed delay: the quota is per unit TIME,
          # so the value of a retry is how far it lands into a new window. Three
          # attempts 5s apart spend the same exhausted budget three times.
          delay=5
          for attempt in 1 2 3 4; do
            if out=$(docker pull "$PG_IMAGE" 2>&1); then
              # Announced on SUCCESS too, and not as noise: the output is
              # captured so it can be classified, so a green log would otherwise
              # say nothing about whether a retry was needed. That number is the
              # only evidence of throttling getting worse, on the one step whose
              # reason for existing is throttling.
              echo "docker pull succeeded on attempt ${attempt}/4"
              pulled=1
              break
            fi
            printf '%s\n' "$out"
            if ! printf '%s' "$out" | grep -qiE 'toomanyrequests|rate exceeded|timeout|connection reset|TLS handshake|unexpected EOF|unexpected status: 5'; then
              echo "::error::docker pull failed for a NON-transient reason — not retrying"
              exit 1
            fi
            [ "$attempt" -eq 4 ] && break
            echo "transient pull failure (attempt ${attempt}/4) — retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 3))
          done
          # `${pulled:-0}` because `set -u` is on and the happy path is the only
          # one that assigns it.
          [ "${pulled:-0}" = 1 ] || {
            echo "::error::docker pull still failing after 4 attempts — see the output above"
            exit 1
          }
          docker run -d --name aai-test-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            "$PG_IMAGE"
          # **`pg_isready` over the SOCKET is a FALSE ready on this image, and
          # COUNTING successes does not fix it.** The entrypoint runs an init
          # phase on a temporary server and then RESTARTS Postgres, so a socket
          # probe can be answered by a server about to go away — measured
          # locally, where `create extension pg_cron` immediately after a
          # first-poll ready failed with "Is the server running locally".
          #
          # The answer to that was three consecutive socket successes a second
          # apart, on the theory that a settled server outlasts the init one.
          # That is a timing gamble rather than a discriminator, and it lost:
          # run 33694602134 took all three inside the init phase and then hit
          # `FATAL: the database system is shutting down` from the extension
          # check below, six seconds after `docker run`.
          #
          # **TCP is the structural discriminator.** The entrypoint starts its
          # temporary server with `listen_addresses=''` — socket only, precisely
          # so nothing outside can reach a half-built database — so a probe on
          # 127.0.0.1 cannot be answered until the real server is listening. It
          # is also the question the SUITE asks: `AAI_TEST_PG_URL` below is a TCP
          # URL, so probe and consumer now agree by construction. The count stays
          # as cheap insurance against a listener that flaps.
          ok=0
          for _ in $(seq 1 90); do
            if docker exec aai-test-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              ok=$((ok + 1))
            else
              ok=0
            fi
            [ "$ok" -ge 3 ] && break
            sleep 1
          done
          [ "$ok" -ge 3 ] || { docker logs aai-test-pg; exit 1; }
          # Fail-fast on the WRONG image rather than mid-suite: the whole point
          # of this image is the four extensions, and a migration dying on
          # `create extension` several suites in reads as a code bug.
          #
          # RETRIED, and that does not weaken the fail-fast. This is the first
          # real query, and the probe above rests on a property of the
          # entrypoint's temporary server rather than on anything this step can
          # observe — so the retry is what makes the step correct even where that
          # reasoning is wrong, which is the half worth having when the symptom
          # is a false red on the only required check. It cannot convert a real
          # failure: `ON_ERROR_STOP=1` plus `grep -qx ok` fails closed, so a
          # missing extension fails all ten attempts and then the job, ~20s later
          # rather than at once.
          exts=0
          for _ in $(seq 1 10); do
            if docker exec aai-test-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
              "select case when count(*) = 4 then 'ok'
                      else 'missing Supabase extensions: ' || count(*)::text || ' of 4' end
               from pg_available_extensions
               where name in ('supabase_vault', 'pgmq', 'pg_cron', 'pg_net');" | grep -qx ok; then
              exts=1
              break
            fi
            sleep 2
          done
          # `${exts:-0}` for the reason `${pulled:-0}` above uses it: `set -u`.
          [ "${exts:-0}" = 1 ] || {
            echo "::error::Postgres never answered with all four Supabase extensions"
            docker logs aai-test-pg
            exit 1
          }
          echo "AAI_TEST_PG_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          # And make a SKIP fail here. The readiness loop above covers the server
          # not starting; it says nothing about the variable not arriving, and if
          # it did not arrive every real-Postgres suite would skip itself and
          # this job would pass — the exact "a check that exists without
          # running" failure their own comments say they must not become.
          echo "AAI_REQUIRE_PG=1" >> "$GITHUB_ENV"
      # ffmpeg for the SDK's real-binary scenario suite
      # (aai/host/ffmpeg.scenario.test.ts). A mocked child cannot check an argv,
      # so this is the only thing standing between a wrong flag and a user's
      # first recording — and it SKIPS without a binary, hence the require flag
      # below, exactly as AAI_REQUIRE_PG above. Linux only: the suite is
      # OS-independent (it generates its own input with lavfi), and brew would
      # spend minutes building the same coverage the ubuntu leg already has, so
      # the macOS leg announces its skip like the Postgres suites do.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # `sed -n 1p` rather than `head -1`: head exits after the first line
          # and, under `pipefail`, a SIGPIPE'd producer would fail this step for
          # printing its own version. sed drains the input.
          ffmpeg -version | sed -n 1p
          ffprobe -version | sed -n 1p
          echo "AAI_REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"
      # Both slow tiers below e2e, in one job. They are separate TASKS — the
      # integration tier is in-memory only and the scenario tier is what needs the
      # Postgres started above — but they share this job's checkout and build, and
      # splitting them into two jobs would pay for that twice for ~20s of work.
      - run: pnpm exec turbo run check:integration check:scenario
      # The TEMPLATE evals, against a SCRIPTED model — and this is not the eval
      # tier arriving in CI by the back door.
      #
      # The eval tier reports and does not gate, because a live model is a noisy
      # instrument and a flaky required check is worse than a number nobody is
      # forced to believe. `AAI_EVAL_STUB=1` is the other mode: the real runtime,
      # the real pipeline, the real tool executor and the real event stream, with
      # the model scripted — deterministic, free, ~1s, and no key involved. What
      # it gates is WIRING, which is what silently rots in a suite that skips:
      # a template whose `agent.ts` no longer boots, whose tools no longer
      # resolve, or whose eval file no longer drives anything would otherwise
      # ship green. Nothing here asserts what a model SAYS.
      #
      # Set EXPLICITLY rather than relied upon being absent: a key reaching this
      # environment one day must not silently turn the required check into a paid,
      # flaky job. `--filter` for the same reason — `aai-evals`' own tier is the
      # live one and stays out of CI entirely.
      - run: pnpm exec turbo run check:eval --filter aai-templates
        env:
          AAI_EVAL_STUB: "1"

  e2e:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: tsdown/rolldown can't resolve .ts exports in aai dist
        os: [ubuntu-latest, macos-latest]
        node: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - id: workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/aai-cli/package.json') }}
      - run: pnpm --filter @alexkroman1/aai-cli exec playwright install --with-deps chromium
      # --concurrency=1: the e2e run republishes every publishable package from
      # the live workspace, truncating shared dist/ directories while it does.
      # Nothing may run beside it. Matches `pnpm test:e2e` and scripts/check.mjs.
      #
      # AAI_REQUIRE_REGISTRY makes a failed install a FAILURE here rather than a
      # visible skip. Three of the four tests can excuse an install failure as a
      # registry-proxy flake, on a predicate over error TEXT — a guess, and this is
      # the one job where a broken published `exports` map surfaces, so on a
      # runner with real egress the excuse has to be off. Same shape and same
      # reason as AAI_REQUIRE_PG in the integration-and-scenario job. It stays available
      # locally, where a developer behind a proxy cannot make the passthrough work.
      - run: pnpm exec turbo run check:e2e --concurrency=1
        env:
          AAI_REQUIRE_REGISTRY: "1"

  # The PLATFORM arm: the local Supabase stack, which is the only configuration
  # anything runs `aai_platform` on.
  #
  # A second Linux-only job rather than a step in the one above, because the two
  # shapes cost differently and the cheap contracts must not be gated behind the
  # expensive ones: the database image (that job) covers Vault, pgmq, pg_cron and
  # pg_net in one `docker run`, while walrus/Realtime, Storage and Auth need
  # containers the database image does not carry — five images, ~4 GB — and they
  # are the arm for four contracts that had NO real arm at all before
  # (`realtime-rls.scenario.test.ts` in particular was written against this stack
  # and ran on no machine anywhere).
  #
  # `-x` trims the stack to what the suites use: studio, the edge runtime,
  # analytics, imgproxy, vector, PostgREST, pg-meta and the mail catcher are all
  # things no test here dials.
  platform-stack:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - id: workspace-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # PINNED, and pinned to the SAME version `ship.yml`'s migrate job
          # applies with. It used to be `latest`, which is the green-in-CI /
          # red-at-release asymmetry running the wrong way: this is the arm
          # whose job is to prove the migrations work, and it proved it with a
          # different CLI than the one that would apply them. The pin's own
          # argument is in that job — "the CLI decides how migrations are
          # applied and what counts as pending" — and it applies at least as
          # strongly here. `ship-workflow-gate.test.ts` asserts the two agree,
          # because two literals in two files is the shape that drifts.
          version: 2.109.1
      # `supabase start` applies supabase/migrations on INIT, so a fresh
      # container cannot drift the way a developer's long-lived stack does (see
      # `ensurePlatformTables`, which reports that drift as a sentence).
      - run: supabase start -x studio,edge-runtime,analytics,imgproxy,vector,rest,meta,inbucket
      # The SAME resolver a developer runs: it shells out to
      # `supabase status -o env`, exports the Supabase trio beside the database
      # URL, and sets AAI_REQUIRE_PG + AAI_REQUIRE_STACK — so a variable that
      # stops arriving is a red job rather than a green one with the only arm for
      # the platform stores silently absent. Going through it rather than
      # hand-writing the exports is the point: a second copy of this wiring in
      # YAML is the thing that rots while looking right.
      #
      # **`--require-stack` is what makes the sentence above TRUE**, and it was
      # missing. The script exported AAI_REQUIRE_STACK only when `resolveStack()`
      # succeeded and let every failure path continue at exit 0, so
      # `supabase start` succeeding while `supabase status -o env` changes shape
      # yielded a green job in which `realtime-rls.scenario.test.ts` — the only
      # walrus/RLS leak test in the repository — never ran at all. Not
      # `pnpm test:pg`, because the flag must not reach a developer's own
      # invocation, where the narrow arm is a legitimate choice.
      - run: node scripts/with-test-pg.mjs --require-stack pnpm test:scenario
      - if: always()
        run: supabase stop --no-backup

  # Single gate job for branch protection — add only "ci" as a required check
  #
  # `setup` MUST be in `needs`, and `"skipped"` MUST NOT be accepted. Both
  # halves were missing, and together they made this gate green on a failing
  # build: all five real jobs declare `needs: setup`, so a broken lockfile or a
  # failing `turbo run build` fails `setup`, GitHub reports every downstream job
  # as `skipped`, and a loop that accepts `skipped` under `if: always()` printed
  # "All CI jobs passed" and exited 0 — on the one check protecting main.
  #
  # No downstream job carries an `if:` condition of any kind, so `skipped` here
  # can only ever mean "a dependency failed". Accepting it buys nothing and
  # costs the entire workflow. Keep it that way: a job that legitimately skips
  # ITSELF would need its own accepted-result list, never a blanket `skipped`.
  ci:
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, lint-typecheck-and-checks, test, integration-and-scenario, platform-stack, e2e]
    steps:
      - name: Check results
        run: |
          results="${{ needs.setup.result }} ${{ needs.lint-typecheck-and-checks.result }} ${{ needs.test.result }} ${{ needs.integration-and-scenario.result }} ${{ needs.platform-stack.result }} ${{ needs.e2e.result }}"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "CI failed: one or more jobs did not succeed ($results)"
              exit 1
            fi
          done
          echo "All CI jobs passed"
