name: Check

on:
  push:
    branches: [changeset-release/main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache TypeScript incremental build info
        uses: actions/cache@v6
        with:
          path: .tsbuildinfo/
          key: tsbuildinfo-build-${{ runner.os }}-${{ hashFiles('packages/*/tsconfig.json', 'tsconfig.json') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            tsbuildinfo-build-${{ runner.os }}-${{ hashFiles('packages/*/tsconfig.json', 'tsconfig.json') }}-
            tsbuildinfo-build-${{ runner.os }}-
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm exec turbo run build
      - uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .tsbuildinfo
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}

  lint-typecheck-and-checks:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: workspace-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .tsbuildinfo
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint typecheck
      - name: Check for changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !contains(github.event.pull_request.labels.*.name, 'no-release')
        run: pnpm changeset status --since=origin/main
      - run: |
          pnpm exec turbo run check:attw check:typecheck
          pnpm run check:knip
          pnpm run check:syncpack
          pnpm run check:sherif
          pnpm run check:markdown
          pnpm run check:publish-names

  # Unit tests sharded by package — run in parallel
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [aai, aai-ui, aai-cli, aai-server, aai-studio-client, aai-templates]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        if: matrix.package == 'aai-server'
        with:
          deno-version: v2.x
      - id: workspace-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .tsbuildinfo
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/${{ matrix.package }}" test:coverage

  integration:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: tsdown/rolldown can't resolve .ts exports in aai dist
        os: [ubuntu-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: workspace-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .tsbuildinfo
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - run: pnpm exec turbo run check:integration

  # Full build + test run inside a Docker container with gVisor (runsc)
  # available — sandbox tests exercise the production isolation path
  # instead of the fake-vm fallback. --privileged is required for runsc.
  docker-test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build test image
        run: docker build -f Dockerfile.test -t aai-test .
      - name: Run unit tests
        run: docker run --rm --privileged -e CI=true aai-test pnpm test
      - name: Run integration tests
        run: docker run --rm --privileged -e CI=true aai-test pnpm test:integration
      - name: Run gVisor integration tests
        run: >-
          docker run --rm --privileged -e CI=true
          -e VITEST_PROFILE=gvisor
          -e "VITEST_INCLUDE=packages/aai-server/gvisor-integration*.test.ts"
          aai-test pnpm vitest run -c vitest.slow.config.ts

  e2e:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows excluded: tsdown/rolldown can't resolve .ts exports in aai dist
        os: [ubuntu-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - id: workspace-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            .tsbuildinfo
            .turbo
          key: workspace-${{ runner.os }}-node${{ hashFiles('.node-version') }}-${{ github.sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/aai-cli/package.json') }}
      - run: pnpm --filter @alexkroman1/aai-cli exec playwright install --with-deps chromium
      - run: pnpm exec turbo run check:e2e

  # Single gate job for branch protection — add only "ci" as a required check
  ci:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-typecheck-and-checks, test, integration, e2e, docker-test]
    steps:
      - name: Check results
        run: |
          results="${{ needs.lint-typecheck-and-checks.result }} ${{ needs.test.result }} ${{ needs.integration.result }} ${{ needs.e2e.result }} ${{ needs.docker-test.result }}"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "CI failed: one or more jobs did not succeed"
              exit 1
            fi
          done
          echo "All CI jobs passed"
